name: Promote to Production

on:
  workflow_run:
    workflows: ["E2E"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm production promotion'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  validate-input:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate confirmation
        if: inputs.confirm != 'promote'
        run: |
          echo "Confirmation required. Type 'promote' to proceed."
          exit 1

  migrate:
    needs: [validate-input]
    if: |
      always() &&
      (needs.validate-input.result == 'success' || needs.validate-input.result == 'skipped') &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'promote')
      )
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Start deployment record
        id: deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Run production migration
        run: pnpm exec prisma migrate deploy --config packages/db/prisma.config.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
      - name: Resolve Vercel deployment
        id: vercel-deployment
        run: bash scripts/ci/resolve-vercel-deployment.sh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Promote Vercel preview to production
        run: npx vercel promote "$DEPLOYMENT_ID" --token "$VERCEL_TOKEN"
        env:
          DEPLOYMENT_ID: ${{ steps.vercel-deployment.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Record production deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          status: ${{ job.status }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          environment_url: https://evanleed.com
          auto_inactive: true
