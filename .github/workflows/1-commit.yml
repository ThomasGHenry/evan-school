name: Commit Validation

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:

  # ─── PHASE 0: GOVERNANCE ──────────────────────────────────────────────────

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
      packages: ${{ steps.filter.outputs.packages }}
      db: ${{ steps.filter.outputs.db }}
      infra: ${{ steps.filter.outputs.infra }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/web-e2e/**'
            packages:
              - 'packages/**'
            db:
              - 'packages/db/**'
            infra:
              - 'infra/**'
            scripts:
              - 'scripts/**'
            docs:
              - 'docs/**'

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7

  validate-adrs:
    name: ADR Structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/ci/validate-adrs.sh docs/adr

  validate-commits:
    name: Commit Messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - run: bash scripts/ci/validate-commits.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/ci/run-shellcheck.sh

  validate-bats-coverage:
    name: BATS Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/ci/validate-bats-coverage.sh

  validate-speckit:
    name: Speckit Structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/ci/validate-speckit.sh

  supply-chain-policy:
    name: Supply-Chain Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/ci/check-supply-chain-policy.sh

  prisma-migrate-check:
    name: Prisma Schema Validity
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate --config packages/db/prisma.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      - run: pnpm exec prisma migrate deploy --config packages/db/prisma.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

  # ─── PHASE 1: QUALITY ─────────────────────────────────────────────────────

  typecheck:
    name: Type Check
    needs: [gitleaks, actionlint, validate-adrs, validate-commits, shellcheck, validate-bats-coverage, validate-speckit, supply-chain-policy, prisma-migrate-check, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate --config packages/db/prisma.config.ts
        env:
          DATABASE_URL: postgresql://localhost/dummy
      - run: pnpm run typecheck

  lint:
    name: Lint
    needs: [gitleaks, actionlint, validate-adrs, validate-commits, shellcheck, validate-bats-coverage, validate-speckit, supply-chain-policy, prisma-migrate-check, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate --config packages/db/prisma.config.ts
        env:
          DATABASE_URL: postgresql://localhost/dummy
      - run: pnpm run lint

  test:
    name: Test
    needs: [gitleaks, actionlint, validate-adrs, validate-commits, shellcheck, validate-bats-coverage, validate-speckit, supply-chain-policy, prisma-migrate-check, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate --config packages/db/prisma.config.ts
        env:
          DATABASE_URL: postgresql://localhost/dummy
      - run: pnpm run test

  build:
    name: Build
    needs: [gitleaks, actionlint, validate-adrs, validate-commits, shellcheck, validate-bats-coverage, validate-speckit, supply-chain-policy, prisma-migrate-check, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate --config packages/db/prisma.config.ts
        env:
          DATABASE_URL: postgresql://localhost/dummy
      - run: pnpm run build

  coverage-gate:
    name: Coverage Gate
    needs: [test, changes]
    if: always() && (needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage
          path: coverage
        continue-on-error: true
      - name: Ratchet coverage floor
        run: |
          if [ -f coverage/lcov.info ]; then
            bash scripts/ci/ratchet-coverage.sh \
              --lcov coverage/lcov.info \
              --package web \
              --floor-file coverage_floor.json
          else
            echo "No coverage artifact found — skipping ratchet (configure vitest coverage output to activate)"
          fi

  # ─── AGGREGATE (sole required GitHub status check) ────────────────────────

  commit-validation:
    name: Commit Validation
    needs: [gitleaks, actionlint, validate-adrs, validate-commits, shellcheck, validate-bats-coverage, validate-speckit, supply-chain-policy, prisma-migrate-check, changes, typecheck, lint, test, build, coverage-gate]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate all jobs succeeded
        run: bash scripts/ci/validate-aggregate.sh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  auto-triage:
    name: Auto Triage
    needs: [commit-validation]
    if: needs.commit-validation.result == 'failure'
    uses: ./.github/workflows/auto-triage.yml
    with:
      workflow_name: ${{ github.workflow }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      commit_sha: ${{ github.sha }}
      actor: ${{ github.actor }}
