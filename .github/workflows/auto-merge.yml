name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify GH_AUTO_MERGE_APP credentials are present
        run: |
          if [ -z "${{ vars.GH_AUTO_MERGE_APP_ID }}" ] || [ -z "${{ secrets.GH_AUTO_MERGE_APP_PRIVATE_KEY }}" ]; then
            echo "::error::GH_AUTO_MERGE_APP_ID or GH_AUTO_MERGE_APP_PRIVATE_KEY is unset." \
              "This is not a transient failure -- see docs/github/bootstrap-runbook.md" \
              "'Recovery: reseed after accidental destroy' before retrying."
            exit 1
          fi
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        id: app-token
        with:
          app-id: ${{ vars.GH_AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.GH_AUTO_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.number }}
